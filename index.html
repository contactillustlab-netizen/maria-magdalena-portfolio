<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Portfolio for Vizireanu Maria-Magdalena, illustrator, graphic designer and concept artist." />
    <!-- Search Console ownership. Google re-checks it, so it has to stay. -->
    <meta name="google-site-verification" content="A5OKMPnOJXBNoK1rZ7bZbafD0PkV2PidsT2yLGf4snc" />
    <title>Maria Magdalena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet" />
    <script>
      // Only the live domain should be indexed. The workers.dev address serves
      // the same build, and would otherwise compete with it in search results.
      if (!['magdavizireanu.com', 'www.magdavizireanu.com'].includes(location.hostname)) {
        document.head.insertAdjacentHTML('beforeend', '<meta name="robots" content="noindex" />');
      }
    </script>
    <!-- Tells Google that this domain and this person are the same entity. The
         sameAs list points at the profiles that already rank for her name, so
         the site is read as part of that identity rather than a stranger. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Maria-Magdalena Vizireanu",
        "url": "https://magdavizireanu.com",
        "jobTitle": "Illustrator & Graphic Designer",
        "sameAs": [
          "https://www.linkedin.com/in/maria-magdalena-vizireanu/",
          "https://www.behance.net/mady21v",
          "https://vizireanumariamagdalena.artstation.com/",
          "https://www.instagram.com/magdamariav/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
